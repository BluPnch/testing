# .gitlab-ci.yml
stages:
  - build
  - test_unit
  - test_integration
  - test_e2e
  - report

variables:
  DB_HOST: "postgres"
  DB_PORT: "5433"
  DB_USER: "postgres"
  DB_PASSWORD: "1"
  DB_NAME: "GreenhouseContext"

default:
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - windows
    - dotnet
    - postgres

services:
  - name: postgres:15
    alias: postgres
    command: ["postgres", "-p", "5433"]
    variables:
      POSTGRES_PASSWORD: "1"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "GreenhouseContext"

before_script:
  - apt-get update
  - apt-get install -y curl postgresql-client
  - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
  - apt-get install -y nodejs
  - npm install

  - echo "Waiting for PostgreSQL..."
  - timeout 60s bash -c 'until PGPASSWORD=1 pg_isready -h postgres -p 5433 -U postgres; do sleep 2; echo "Waiting..."; done'

  - PGPASSWORD=1 psql -h postgres -p 5433 -U postgres -c "CREATE DATABASE \"GreenhouseContext\" ENCODING 'UTF8';" 2>/dev/null || echo "Database already exists"

  - node scripts/init-test-db.js || echo "DB init completed"

# Функция для отката базы данных
.cleanup_database: &cleanup_database |
  echo "Cleaning up database..."
  PGPASSWORD=1 psql -h postgres -p 5433 -U postgres -c "
    DROP DATABASE IF EXISTS \"GreenhouseContext\";
    CREATE DATABASE \"GreenhouseContext\" ENCODING 'UTF8';
  " || echo "Database cleanup completed"
  node scripts/init-test-db.js || echo "Database reinitialization completed"

build_solution:
  stage: build
  script:
    - cd src
    - echo "=== BUILDING SOLUTION ==="
    - dotnet restore
    - dotnet build --verbosity normal
    - echo "=== BUILD COMPLETED SUCCESSFULLY ==="
  artifacts:
    paths:
      - src/**/bin/
      - src/**/obj/
    expire_in: 1 hour

unit_tests:
  stage: test_unit
  needs: ["build_solution"]  # Зависит от сборки
  script:
    - cd src
    - echo "=== RUNNING UNIT TESTS ==="
    - dotnet test UnitTests/UnitTests.csproj --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory "../test-results"
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.trx

integration_tests:
  stage: test_integration
  needs: ["unit_tests"]  # Зависит от unit тестов
  before_script:
    - *cleanup_database
  script:
    - cd src
    - echo "=== RUNNING INTEGRATION TESTS ==="
    - dotnet test IntegrationTests/IntegrationTests.csproj --no-build --logger "trx;LogFileName=integration-tests.trx" --results-directory "../test-results"
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.trx
  allow_failure: false

e2e_tests:
  stage: test_e2e
  needs: ["integration_tests"]  # Зависит от integration тестов
  before_script:
    - *cleanup_database
    # Установка зависимостей для E2E тестов
    - apt-get update && apt-get install -y wget unzip fontconfig libfreetype6 libx11-6 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6
  script:
    - cd src
    - echo "=== RUNNING E2E TESTS ==="
    - dotnet test E2ETests/E2ETests.csproj --no-build --logger "trx;LogFileName=e2e-tests.trx" --results-directory "../test-results"
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.trx
  allow_failure: true  # E2E тесты могут быть нестабильны

generate_report:
  stage: report
  needs: []
  script:
    - echo "=== TEST EXECUTION SUMMARY ==="
    - echo "Build: SUCCESS"
    - echo "Unit Tests: COMPLETED"
    - echo "Integration Tests: COMPLETED"
    - echo "E2E Tests: COMPLETED"
    - echo "=== CHECK ARTIFACTS FOR DETAILED RESULTS ==="
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.trx