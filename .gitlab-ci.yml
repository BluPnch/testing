# .gitlab-ci.yml
stages:
  - build
  - test_unit
  - test_integration
  - test_e2e
  - report

variables:
  DB_HOST: "localhost"
  DB_PORT: "5433"
  DB_USER: "postgres"
  DB_PASSWORD: "1"
  DB_NAME: "GreenhouseContext"
  DATABASE_URL: "postgresql://postgres:1@localhost:5433/GreenhouseContext"


default:
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - windows
    - dotnet
    - postgres

services:
  - name: postgres:15
    command: ["postgres", "-p", "5433", "-c", "listen_addresses=*"]
    variables:
      POSTGRES_PASSWORD: "1"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "GreenhouseContext"

before_script:
  - apt-get update
  - apt-get install -y curl postgresql-client nodejs net-tools
  - npm install

  # Диагностика сети
  - echo "=== NETWORK DIAGNOSTICS ==="
  - hostname
  - cat /etc/hosts
  - netstat -tulpn | grep 5433 || echo "PostgreSQL not found on 5433"
  
  # Проверка разных хостов
  - echo "Testing connection to different hosts:"
  - PGPASSWORD=1 pg_isready -h localhost -p 5433 -U postgres && echo "✅ localhost works" || echo "❌ localhost fails"
  - PGPASSWORD=1 pg_isready -h postgres -p 5433 -U postgres && echo "✅ postgres works" || echo "❌ postgres fails"
  - PGPASSWORD=1 pg_isready -h 127.0.0.1 -p 5433 -U postgres && echo "✅ 127.0.0.1 works" || echo "❌ 127.0.0.1 fails"

# Функция для отката базы данных
.cleanup_database: &cleanup_database |
  echo "Cleaning up database on localhost:5433..."
  PGPASSWORD=1 psql -h localhost -p 5433 -U postgres -c "
    SELECT pg_terminate_backend(pid) 
    FROM pg_stat_activity 
    WHERE datname = 'GreenhouseContext' AND pid <> pg_backend_pid();
  " 2>/dev/null || true
  
  PGPASSWORD=1 psql -h localhost -p 5433 -U postgres -c "
    DROP DATABASE IF EXISTS \"GreenhouseContext\";
    CREATE DATABASE \"GreenhouseContext\" ENCODING 'UTF8';
  " || echo "Database recreated"
  
  node scripts/init-test-db.js
  
build_solution:
  stage: build
  cache:
    key: "${CI_COMMIT_REF_SLUG}-build"
    paths:
      - .nuget/
      - src/**/bin/
      - src/**/obj/
    policy: pull-push
  script:
    - cd src
    - echo "=== BUILDING SOLUTION ==="
    - dotnet restore
    - dotnet build --verbosity normal
    - echo "=== BUILD COMPLETED SUCCESSFULLY ==="
  artifacts:
    paths:
      - src/**/bin/
      - src/**/obj/
    expire_in: 1 hour

unit_tests:
  stage: test_unit
  needs: ["build_solution"]  # Зависит от сборки
  script:
    - cd src
    - echo "=== RUNNING UNIT TESTS ==="
    - dotnet test UnitTests/UnitTests.csproj --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory "../test-results"
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.trx

integration_tests:
  stage: test_integration
  needs: ["unit_tests"] 
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client nodejs
    - npm install dotenv pg
    - *cleanup_database
  script:
    - cd src
    - echo "=== RUNNING INTEGRATION TESTS ==="
    - dotnet test IntegrationTests/IntegrationTests.csproj --no-build --logger "trx;LogFileName=integration-tests.trx" --results-directory "../test-results"
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.trx
  allow_failure: false

e2e_tests:
  stage: test_e2e
  needs: ["integration_tests"]  # Зависит от integration тестов
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client nodejs wget unzip fontconfig libfreetype6 libx11-6 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6
    - *cleanup_database
    # Установка зависимостей для E2E тестов
    - apt-get update && apt-get install -y wget unzip fontconfig libfreetype6 libx11-6 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6
  script:
    - cd src
    - echo "=== RUNNING E2E TESTS ==="
    - dotnet test E2ETests/E2ETests.csproj --no-build --logger "trx;LogFileName=e2e-tests.trx" --results-directory "../test-results"
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.trx
  allow_failure: true  # E2E тесты могут быть нестабильны

generate_report:
  stage: report
  needs: []
  script:
    - echo "=== TEST EXECUTION SUMMARY ==="
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.trx