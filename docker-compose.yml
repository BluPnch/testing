version: '3.8'

services:
  benchmark-net8:
    build:
      context: .
      dockerfile: docker/net8/Dockerfile
    image: bench/linq-net8:latest
    container_name: linq-net8
    networks: [bench]
    volumes:
      - ./results:/app/results
    restart: unless-stopped

  benchmark-net9:
    build:
      context: .
      dockerfile: docker/net9/Dockerfile
    image: bench/linq-net9:latest
    container_name: linq-net9
    networks: [bench]
    volumes:
      - ./results:/app/results
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8089:8080"
    networks: [bench]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    depends_on:
      - benchmark-net8
      - benchmark-net9

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [bench]
    restart: unless-stopped
    depends_on:
      - cadvisor

networks:
  bench:
    driver: bridge

volumes:
  prometheus_data: