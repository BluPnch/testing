global:
  scrape_interval: 2s
  evaluation_interval: 2s
  external_labels:
    monitor: 'linq-benchmark'

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 5s
    metrics_path: /metrics

  - job_name: 'benchmark-containers'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(.*)'
        action: keep