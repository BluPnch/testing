name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DB_HOST: localhost
  DB_PORT: 5433
  DB_USER: postgres
  DB_PASSWORD: 1
  DB_NAME: GreenhouseContext
  DATABASE_URL: postgresql://postgres:1@localhost:5433/GreenhouseContext

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: 1
          POSTGRES_USER: postgres
          POSTGRES_DB: GreenhouseContext
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: |
          npm install

      - name: Wait for PostgreSQL
        run: |
          timeout 90s bash -c 'until PGPASSWORD=1 pg_isready -h localhost -p 5433 -U postgres; do sleep 3; echo "Waiting..."; done'

      - name: Initialize test database
        run: |
          PGPASSWORD=1 psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE \"GreenhouseContext\" ENCODING 'UTF8';" 2>/dev/null || echo "Database already exists"
          node scripts/init-test-db.js || echo "DB init completed"

      - name: Restore dependencies
        run: |
          cd src
          dotnet restore

      - name: Build solution
        run: |
          cd src
          dotnet build --verbosity normal

      - name: Test Summary
        run: |
          echo "✅ Build completed successfully"

  unit_tests:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: 1
          POSTGRES_USER: postgres
          POSTGRES_DB: GreenhouseContext
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: |
          cd src
          dotnet test UnitTests/UnitTests.csproj --logger "trx;LogFileName=unit-tests.trx" --results-directory "../test-results"

      - name: Display test results
        run: |
          echo "=== Unit Tests Summary ==="
          if [ -f "test-results/unit-tests.trx" ]; then
            echo "✅ Unit tests completed - results saved"
          else
            echo "❌ No unit test results found"
          fi

  integration_tests:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: 1
          POSTGRES_USER: postgres
          POSTGRES_DB: GreenhouseContext
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Cleanup and initialize database
        run: |
          echo "Cleaning up database..."
          PGPASSWORD=1 psql -h localhost -p 5433 -U postgres -c "
            SELECT pg_terminate_backend(pid) 
            FROM pg_stat_activity 
            WHERE datname = 'GreenhouseContext' AND pid <> pg_backend_pid();
          " 2>/dev/null || true
          
          PGPASSWORD=1 psql -h localhost -p 5433 -U postgres -c "
            DROP DATABASE IF EXISTS \"GreenhouseContext\";
            CREATE DATABASE \"GreenhouseContext\" ENCODING 'UTF8';
          " || echo "Database recreated"
          
          node scripts/init-test-db.js

      - name: Run integration tests
        run: |
          cd src
          dotnet test IntegrationTests/IntegrationTests.csproj --logger "trx;LogFileName=integration-tests.trx" --results-directory "../test-results"

      - name: Display test results
        run: |
          echo "=== Integration Tests Summary ==="
          if [ -f "test-results/integration-tests.trx" ]; then
            echo "✅ Integration tests completed - results saved"
          else
            echo "❌ No integration test results found"
          fi

  e2e_tests:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: 1
          POSTGRES_USER: postgres
          POSTGRES_DB: GreenhouseContext
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Install E2E dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip fontconfig libfreetype6 libx11-6 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6

      - name: Cleanup and initialize database
        run: |
          echo "Cleaning up database..."
          PGPASSWORD=1 psql -h localhost -p 5433 -U postgres -c "
            SELECT pg_terminate_backend(pid) 
            FROM pg_stat_activity 
            WHERE datname = 'GreenhouseContext' AND pid <> pg_backend_pid();
          " 2>/dev/null || true
          
          PGPASSWORD=1 psql -h localhost -p 5433 -U postgres -c "
            DROP DATABASE IF EXISTS \"GreenhouseContext\";
            CREATE DATABASE \"GreenhouseContext\" ENCODING 'UTF8';
          " || echo "Database recreated"
          
          node scripts/init-test-db.js

      - name: Run E2E tests
        run: |
          cd src
          dotnet test E2ETests/E2ETests.csproj --logger "trx;LogFileName=e2e-tests.trx" --results-directory "../test-results"

      - name: Display test results
        run: |
          echo "=== E2E Tests Summary ==="
          if [ -f "test-results/e2e-tests.trx" ]; then
            echo "✅ E2E tests completed - results saved"
          else
            echo "❌ No E2E test results found"
          fi

  report:
    runs-on: ubuntu-latest
    needs: [unit_tests, integration_tests, e2e_tests]
    if: always()
    
    steps:
      - name: Test Execution Summary
        run: |
          echo "=== FINAL TEST EXECUTION SUMMARY ==="
          echo "Unit Tests: ${{ needs.unit_tests.result }}"
          echo "Integration Tests: ${{ needs.integration_tests.result }}"
          echo "E2E Tests: ${{ needs.e2e_tests.result }}"
          echo "====================================="